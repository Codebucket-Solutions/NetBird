name: Qualify enterprise overlay

# Proves that the overlay still applies to the locked upstream and that the
# enterprise build compiles and passes its tests. The builds are thrown away:
# nothing from this workflow is stored or published. Releases come from
# release.yml, which builds again with the fleet token and signs the result.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }} candidate
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out enterprise overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Windows candidate
        id: build
        uses: ./.github/actions/build-windows
        with:
          arch: ${{ matrix.arch }}
          run_tests: ${{ matrix.arch == 'amd64' }}

      # The runner is amd64, so only that build can be started. The daemon runs
      # as a service and the UI is kept running for a while; the enterprise
      # hook polls the policy server and is expected to be refused here.
      # A console-subsystem build without the production tag: the Wails
      # runtime then reports on stderr what the shipped build discards.
      - name: Build a diagnostic UI
        if: matrix.arch == 'amd64'
        shell: bash
        env:
          DISTRIBUTION: ${{ steps.build.outputs.distribution }}
        run: |
          set -euo pipefail
          source="$(cygpath -u '${{ runner.temp }}')/netbird-source"
          (cd "$source/client/ui" && wails3 task windows:build:console ARCH=amd64 DEV=true EXTRA_TAGS=enterprise)
          cp "$source/client/ui/bin/netbird-ui-console.exe" "$(cygpath -u "$DISTRIBUTION")/windows-amd64/"

      - name: Smoke test the build
        if: matrix.arch == 'amd64'
        shell: bash
        env:
          DISTRIBUTION: ${{ steps.build.outputs.distribution }}
        run: |
          set -euo pipefail
          python scripts/smoke_windows.py \
            --expected-version "$(python scripts/overlay.py build-version)" \
            --directory "$(cygpath -u "$DISTRIBUTION")/windows-amd64" \
            --diagnostic-ui "$(cygpath -u "$DISTRIBUTION")/windows-amd64/netbird-ui-console.exe"
