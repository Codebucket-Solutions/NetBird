name: Qualify enterprise overlay

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_enterprise_hook:
        description: Fail unless the enterprise hook and invariants are present
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      require_enterprise_hook:
        description: Fail unless the enterprise hook and invariants are present
        required: false
        default: true
        type: boolean
      embed_fleet_token:
        description: Link the fleet token into the daemon; only the release workflow asks for this
        required: false
        default: false
        type: boolean
    secrets:
      NB_ENTERPRISE_POLICY_TOKEN:
        description: Fleet token linked into release builds when embed_fleet_token is set
        required: false

permissions:
  contents: read

concurrency:
  group: qualify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }} candidate
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out enterprise overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Reconstruct locked source
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(cygpath -u '${{ runner.temp }}')"
          python scripts/overlay.py materialize \
            --destination "$temp_dir/netbird-source" \
            --require-enterprise-hook

      - name: Set up Go from locked source
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ runner.temp }}/netbird-source/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11.4.0'
          run_install: false

      - name: Test enterprise controls
        if: matrix.arch == 'amd64'
        working-directory: ${{ runner.temp }}/netbird-source
        shell: bash
        run: |
          set -euo pipefail
          go test -tags enterprise ./client/enterprise/...
          go test -tags enterprise ./client/ui/services
          go test -run '^$' -tags enterprise ./client/cmd
          go test -run '^$' ./client/cmd

      - name: Install Wails CLI matching the locked module graph
        working-directory: ${{ runner.temp }}/netbird-source
        shell: bash
        run: |
          set -euo pipefail
          wails_version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${wails_version}"

      - name: Build daemon and UI
        working-directory: ${{ runner.temp }}/netbird-source
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          # Empty for every run except a release that passes the secret. The
          # build and its artifacts are public, so is a token linked into them.
          FLEET_TOKEN: ${{ inputs.embed_fleet_token && secrets.NB_ENTERPRISE_POLICY_TOKEN || '' }}
        run: |
          set -euo pipefail
          output="$PWD/enterprise-dist/windows-${TARGET_ARCH}"
          mkdir -p "$output"

          # The daemon reports this version to NetBird. Engineering Fabric
          # admits only peers whose version carries the +codebuckets stamp.
          overlay_root="$(cygpath -u '${{ github.workspace }}')"
          netbird_version="$(python "$overlay_root/scripts/overlay.py" build-version)"
          echo "Enterprise build version: ${netbird_version}"

          ldflags="-X github.com/netbirdio/netbird/version.version=${netbird_version}"
          if [ -n "$FLEET_TOKEN" ]; then
            ldflags="${ldflags} -X github.com/netbirdio/netbird/client/enterprise.policyToken=${FLEET_TOKEN}"
          fi

          CGO_ENABLED=0 GOOS=windows GOARCH="$TARGET_ARCH" \
            go build -trimpath -tags 'enterprise,load_wgnt_from_rsrc' \
              -ldflags "$ldflags" \
              -o "$output/netbird.exe" ./client

          (
            cd client/ui
            wails3 task windows:build "ARCH=${TARGET_ARCH}" 'EXTRA_TAGS=enterprise'
          )
          cp client/ui/bin/netbird-ui.exe "$output/netbird-ui.exe"
          temp_dir="$(cygpath -u '${{ runner.temp }}')"
          cp "$temp_dir/netbird-source.provenance.json" "$output/provenance.json"

          archive="$PWD/enterprise-dist/netbird-enterprise-windows-${TARGET_ARCH}.zip"
          python -m zipfile -c "$archive" "$output"
          python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); pathlib.Path(str(p)+".sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n", encoding="ascii")' "$archive"

      - name: Upload Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-windows-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/netbird-source/enterprise-dist/*.zip
            ${{ runner.temp }}/netbird-source/enterprise-dist/*.sha256
          if-no-files-found: error
          retention-days: 14
