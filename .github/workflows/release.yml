name: Publish enterprise release

# A release starts from the Actions tab, or by pushing its tag
# (for example v0.80.0-enterprise.0). The tag must match the lock and the
# enterprise revision in overlay.config.json.
#
# Each architecture is built, signed, packaged into upstream's NSIS and MSI
# installers, signed again and uploaded to the release bucket inside one job.
# Nothing is stored as a workflow artifact: the bucket is the only place a
# release exists, and latest.json is switched last.
on:
  push:
    tags:
      - 'v*-enterprise.*'
  workflow_dispatch:
    inputs:
      enterprise_revision:
        description: Enterprise revision from overlay.config.json
        required: true
        type: string
      signing_test_only:
        description: Build and sign without uploading anything
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: enterprise-release
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: auto
  AWS_ENDPOINT_URL: https://242336bb32cd0b7be83c597188934f79.r2.cloudflarestorage.com
  # R2 does not implement the newer default checksum trailers.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  RELEASE_BUCKET: codebucket-netbird-client
  PUBLIC_MANIFEST_URL: https://netbird-client.download.codebuckets.in/latest.json

jobs:
  preflight:
    name: Validate protected release gate
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.gate.outputs.release_tag }}
      upstream_tag: ${{ steps.gate.outputs.upstream_tag }}
    steps:
      - name: Check out enterprise overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Enforce release configuration
        id: gate
        shell: bash
        env:
          REQUESTED_REVISION: ${{ inputs.enterprise_revision }}
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          # A pushed tag ends in the enterprise revision.
          revision="${REQUESTED_REVISION:-${PUSHED_TAG##*.}}"
          # Refuse a release that is not newer than what clients see before
          # building anything. The bucket is checked again before publishing.
          published_arguments=()
          if curl -fsS --retry 3 --retry-delay 5 -o published-latest.json "$PUBLIC_MANIFEST_URL"; then
            published_arguments=(--published-manifest published-latest.json)
          fi
          gate="$(python scripts/overlay.py release-preflight \
            --enterprise-revision "$revision" \
            "${published_arguments[@]}" \
            ${{ inputs.signing_test_only && '--allow-release-disabled' || '' }})"
          echo "$gate"
          if [ -n "$PUSHED_TAG" ]; then
            expected="$(printf '%s' "$gate" | python -c 'import json,sys; print(json.load(sys.stdin)["release_tag"])')"
            if [ "$PUSHED_TAG" != "$expected" ]; then
              echo "Pushed tag $PUSHED_TAG does not match the configured release $expected" >&2
              exit 1
            fi
          fi

  build-sign-upload:
    name: Windows ${{ matrix.arch }} release
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - name: Check out enterprise overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Windows candidate
        id: build
        uses: ./.github/actions/build-windows
        with:
          arch: ${{ matrix.arch }}
          run_tests: ${{ matrix.arch == 'amd64' }}
          fleet_token: ${{ secrets.NB_ENTERPRISE_POLICY_TOKEN }}

      - name: Sign and verify Windows executables
        shell: bash
        env:
          CSCA1_CERT: ${{ secrets.CSCA1_CERT }}
          CSCA1_KEY: ${{ secrets.CSCA1_KEY }}
          DISTRIBUTION: ${{ steps.build.outputs.distribution }}
        run: |
          set -euo pipefail
          python scripts/sign_windows.py \
            --input-directory "$(cygpath -u "$DISTRIBUTION")" \
            --output-directory signed

      # Upstream's installer definitions (client/installer.nsis, client/netbird.wxs)
      # are used unchanged over the signed binaries, so the enterprise build
      # installs exactly like, and in place of, the official client: same
      # service name, install directory, and MSI upgrade code.
      - name: Stage the signed binaries, wintun, and installer tooling
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          source="$(cygpath -u '${{ runner.temp }}')/netbird-source"
          stage="$source/dist/netbird_windows_${ARCH}"
          mkdir -p "$stage" downloads
          python -m zipfile -e "signed/netbird-enterprise-windows-${ARCH}.zip" "$stage"

          python scripts/fetch.py https://pkgs.netbird.io/wintun/wintun-0.14.1.zip downloads/wintun.zip \
            07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
          python -m zipfile -e downloads/wintun.zip downloads/wintun
          cp "downloads/wintun/wintun/bin/${ARCH}/wintun.dll" "$stage/"

          # NSIS plugins the installer script needs; makensis on the runner is the 32-bit Unicode build.
          plugins="/c/Program Files (x86)/NSIS/Plugins/x86-unicode"
          python scripts/fetch.py https://pkgs.netbird.io/nsis/EnVar_plugin.zip downloads/envar.zip \
            e9aa92de351345ed82795251d838f1ae9041ba35af9d381a5780c7843b01f56a
          python -m zipfile -e downloads/envar.zip downloads/envar
          cp downloads/envar/Plugins/x86-unicode/EnVar.dll "$plugins/"
          if [ "$ARCH" = amd64 ]; then
            python scripts/fetch.py https://pkgs.netbird.io/nsis/ShellExecAsUser_amd64-Unicode.7z downloads/shellexecasuser.7z \
              0a55ea25c7330a92cec028eda8afcaf1b1a7092e0dfb77c21c8f654564b4ff9d
            "/c/Program Files/7-Zip/7z.exe" x -y -odownloads/shellexecasuser downloads/shellexecasuser.7z >/dev/null
            find downloads/shellexecasuser -name '*.dll' -exec cp {} "$plugins/" \;
          fi

          # The WebView2 bootstrapper the installers carry for the UI.
          (cd "$source" && wails3 generate webview2bootstrapper -dir client)

      - name: Build the installers
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python scripts/build_installers.py \
            --source "$(cygpath -u '${{ runner.temp }}')/netbird-source" \
            --arch "$ARCH" \
            --output release

      - name: Sign and verify the installers
        shell: bash
        env:
          CSCA1_CERT: ${{ secrets.CSCA1_CERT }}
          CSCA1_KEY: ${{ secrets.CSCA1_KEY }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python scripts/sign_windows.py --files \
            "release/netbird-enterprise-windows-${ARCH}.exe" \
            "release/netbird-enterprise-windows-${ARCH}.msi"

      - name: Refuse to overwrite a published release
        if: ${{ !inputs.signing_test_only }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if aws s3api head-object --bucket "$RELEASE_BUCKET" --key "releases/${RELEASE_TAG}/latest.json" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} is already in the bucket and will not be overwritten" >&2
            exit 1
          fi

      # The installers are downloadable from here on, but nothing points at
      # them until latest.json is switched by the publish job.
      - name: Upload the signed installers
        if: ${{ !inputs.signing_test_only }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
        run: |
          set -euo pipefail
          aws s3 cp release "s3://${RELEASE_BUCKET}/releases/${RELEASE_TAG}/" \
            --recursive --exclude '*' --include '*.exe' --include '*.msi' --include '*.sha256' --no-progress

  publish:
    name: Switch latest.json
    if: ${{ !inputs.signing_test_only }}
    needs:
      - preflight
      - build-sign-upload
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - name: Check out enterprise overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # The manifest describes the bytes that are in the bucket, which the
      # .sha256 files written at signing time prove are the signed ones.
      - name: Download the uploaded release
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "s3://${RELEASE_BUCKET}/releases/${RELEASE_TAG}/" release-assets \
            --recursive --exclude '*' --include '*.exe' --include '*.msi' --include '*.sha256' --no-progress

      - name: Build the release manifest
        shell: bash
        run: |
          set -euo pipefail
          # The published manifest, when there is one, proves this release is newer.
          published_arguments=()
          if aws s3 cp "s3://${RELEASE_BUCKET}/latest.json" published-latest.json --no-progress >/dev/null 2>&1; then
            published_arguments=(--published-manifest published-latest.json)
          fi
          python scripts/overlay.py release-manifest \
            --artifacts-directory release-assets \
            --output latest.json \
            "${published_arguments[@]}"

      # latest.json is what clients and Engineering Fabric read. It is switched
      # last, so the release it names is already downloadable. From that moment
      # every older build stops being allowed to connect.
      - name: Switch latest.json
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp latest.json "s3://${RELEASE_BUCKET}/releases/${RELEASE_TAG}/latest.json" \
            --content-type application/json --no-progress
          aws s3 cp latest.json "s3://${RELEASE_BUCKET}/latest.json" \
            --content-type application/json --cache-control 'no-cache, max-age=60' --no-progress

      - name: Check what clients will download
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python -c 'import json; print(json.load(open("latest.json"))["version"])')"
          published="$(curl -fsS --retry 5 --retry-delay 5 "$PUBLIC_MANIFEST_URL" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          if [ "$published" != "$expected" ]; then
            echo "The public manifest names ${published}, expected ${expected}" >&2
            exit 1
          fi
          echo "Published ${published}"
