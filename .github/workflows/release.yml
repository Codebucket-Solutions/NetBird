name: Create enterprise draft release

on:
  workflow_dispatch:
    inputs:
      enterprise_revision:
        description: Enterprise revision from overlay.config.json
        required: true
        type: string
      signing_test_only:
        description: Exercise signing without creating a release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: enterprise-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate protected release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.gate.outputs.release_tag }}
      upstream_tag: ${{ steps.gate.outputs.upstream_tag }}
    steps:
      - name: Check out enterprise overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Enforce release configuration
        id: gate
        env:
          REQUESTED_REVISION: ${{ inputs.enterprise_revision }}
        run: >-
          python scripts/overlay.py release-preflight
          --enterprise-revision "$REQUESTED_REVISION"
          ${{ inputs.signing_test_only && '--allow-release-disabled' || '' }}

  qualify:
    name: Rebuild protected candidates
    needs: preflight
    uses: ./.github/workflows/qualify.yml
    with:
      require_enterprise_hook: true
    permissions:
      contents: read

  sign-windows:
    name: Authenticode Windows ${{ matrix.arch }}
    needs:
      - preflight
      - qualify
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out enterprise overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Download qualified Windows candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/unsigned

      - name: Sign and verify Windows executables
        env:
          CSCA1_CERT: ${{ secrets.CSCA1_CERT }}
          CSCA1_KEY: ${{ secrets.CSCA1_KEY }}
        run: >-
          python scripts/sign_windows.py
          --input-directory "${{ runner.temp }}/unsigned"
          --output-directory "${{ runner.temp }}/signed-${{ matrix.arch }}"

      - name: Upload signed Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/signed-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Publish signed-Windows draft
    if: ${{ inputs.signing_test_only == false }}
    needs:
      - preflight
      - qualify
      - sign-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out enterprise overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Download signed Windows candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: signed-windows-*
          path: release-assets
          merge-multiple: true

      - name: Download qualified macOS candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-macos-*
          path: release-assets
          merge-multiple: true

      - name: Reconstruct and archive auditable source
        run: |
          python scripts/overlay.py materialize \
            --destination '${{ runner.temp }}/netbird-source' \
            --require-enterprise-hook
          git -C '${{ runner.temp }}/netbird-source' archive \
            --format=tar.gz \
            --prefix='netbird-enterprise-source/' \
            --output="$PWD/release-assets/netbird-enterprise-source.tar.gz" \
            HEAD
          cp '${{ runner.temp }}/netbird-source.provenance.json' './release-assets/source-provenance.json'

      - name: Create aggregate checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create immutable draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.preflight.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-enterprise\.[1-9][0-9]*$ ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists and will not be overwritten: $RELEASE_TAG" >&2
            exit 1
          fi

          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          {
            echo "Enterprise client candidate based on upstream ${UPSTREAM_TAG}."
            echo
            echo 'Windows executables are Authenticode-signed with the Codebucket private code-signing CA.'
            echo 'This release remains a draft until macOS Developer ID signing and notarization complete.'
          } > "$notes_file"

          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --draft \
            --title "$RELEASE_TAG" \
            --notes-file "$notes_file"
